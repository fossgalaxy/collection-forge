---

- name: Ensure bind directory exists
  become: true
  ansible.builtin.file:
    path: "{{ gitpages_bind_dir }}"
    state: directory
    mode: '0500'
    owner: "{{ gitpages_bind_user }}"
    group: "{{ gitpages_bind_group }}"
    setype: container_file_t

- name: Ensure settings file exists
  become: true
  ansible.builtin.template:
    src: "settings.toml.j2"
    dest: "{{ gitpages_bind_conf }}"
    owner: "{{ gitpages_bind_user }}"
    group: "{{ gitpages_bind_group }}"
    mode: '0400'
    setype: container_file_t
  notify:
    - Reload Git Pages

- name: Ensure data volume exists
  become: true
  containers.podman.podman_volume:
    name: "{{ gitpages_storage_volume }}"
    state: quadlet
  notify:
    - Reload Git Pages

- name: Ensure pages container exists
  become: true
  containers.podman.podman_container:
    name: "{{ gitpages_service }}"
    image: "{{ gitpages_image }}"
    state: quadlet
    env: "{{ gitpages_env | combine(gitpages_extra_env) }}"
    secrets: "{{ gitpages_secrets + gitpages_extra_secrets }}"
    volumes: "{{ gitpages_volumes + gitpages_extra_volumes }}"
    label: "{{ gitpages_labels | combine(gitpages_extra_labels) }}"
    quadlet_options: "{{ gitpages_quadlet_options + gitpages_extra_quadlet_options }}"
  notify:
    - Reload Git Pages
