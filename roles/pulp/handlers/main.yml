---

- name: "Reload Pulp API"
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "{{ pulp_api_service }}"
    state: restarted

- name: "Reload Pulp Content"
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "{{ pulp_content_service }}"
    state: restarted

- name: "Reload Pulp Worker"
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "{{ pulp_worker_service }}"
    state: restarted

